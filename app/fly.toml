# PLANTILLA: "desdemovil-npi" es el nombre de la app en Fly.io. Cambialo aqui y en
# .github/workflows/deploy.yml (variable FLY_APP); los dos valores deben coincidir.
app = "desdemovil-npi"
# PLANTILLA: region de Fly.io. "mad" esta deprecada; alternativas europeas: cdg, ams, lhr.
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
